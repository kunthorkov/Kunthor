name: Update Current Activity

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          username = "kunthorkov"

          url = f"https://api.github.com/users/{username}/events/public"

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {__import__('os').environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  events = json.load(response)
          except Exception as error:
              print("Could not get GitHub activity:", error)
              events = []

          activity = "📚 Currently learning and building new projects."

          for event in events:
              event_type = event.get("type")
              repo = event.get("repo", {}).get("name", "")
              payload = event.get("payload", {})

              if event_type == "PushEvent":
                  commits = payload.get("commits", [])
                  count = len(commits)
                  activity = f"💻 Pushed {count} commit(s) to `{repo}`"
                  break

              elif event_type == "CreateEvent":
                  ref_type = payload.get("ref_type", "repository")
                  activity = f"🚀 Created a new {ref_type} in `{repo}`"
                  break

              elif event_type == "PullRequestEvent":
                  action = payload.get("action", "updated")
                  activity = f"🔀 {action.capitalize()} a pull request in `{repo}`"
                  break

              elif event_type == "IssuesEvent":
                  action = payload.get("action", "updated")
                  activity = f"🐛 {action.capitalize()} an issue in `{repo}`"
                  break

              elif event_type == "WatchEvent":
                  activity = f"⭐ Starred `{repo}`"
                  break

              elif event_type == "ForkEvent":
                  activity = f"🍴 Forked `{repo}`"
                  break

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          new_section = f"""<!-- CURRENT_ACTIVITY_START -->
          ### 🔥 Latest GitHub Activity

          > {activity}

          _Last updated: {now}_
          <!-- CURRENT_ACTIVITY_END -->"""

          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          pattern = r"<!-- CURRENT_ACTIVITY_START -->.*?<!-- CURRENT_ACTIVITY_END -->"

          if re.search(pattern, readme, re.DOTALL):
              readme = re.sub(
                  pattern,
                  new_section.strip(),
                  readme,
                  flags=re.DOTALL
              )
          else:
              readme += "\n\n" + new_section.strip() + "\n"

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(readme)

          print("Activity updated:")
          print(activity)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update current activity"
            git push
          fi

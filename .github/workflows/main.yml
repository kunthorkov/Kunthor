name: Update Current Activity

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone

          username = "kunthorkov"

          url = f"https://api.github.com/users/{username}/events/public"

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer ${{ secrets.GITHUB_TOKEN }}"
              }
          )

          with urllib.request.urlopen(request) as response:
              events = json.load(response)

          activity = "📚 Currently learning and building new projects."

          for event in events:
              event_type = event.get("type")
              repo = event.get("repo", {}).get("name", "")

              if event_type == "PushEvent":
                  commits = event.get("payload", {}).get("commits", [])
                  activity = f"💻 Pushed {len(commits)} commit(s) to `{repo}`"
                  break

              if event_type == "CreateEvent":
                  activity = f"🚀 Created something new in `{repo}`"
                  break

              if event_type == "PullRequestEvent":
                  action = event.get("payload", {}).get("action", "updated")
                  activity = f"🔀 {action.capitalize()} a pull request in `{repo}`"
                  break

              if event_type == "IssuesEvent":
                  action = event.get("payload", {}).get("action", "updated")
                  activity = f"🐛 {action.capitalize()} an issue in `{repo}`"
                  break

              if event_type == "WatchEvent":
                  activity = f"⭐ Starred `{repo}`"
                  break

              if event_type == "ForkEvent":
                  activity = f"🍴 Forked `{repo}`"
                  break

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          new_section = f"""<!-- CURRENT_ACTIVITY_START -->
### 🔥 Latest GitHub Activity

> {activity}

_Last updated: {now}_
<!-- CURRENT_ACTIVITY_END -->"""

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- CURRENT_ACTIVITY_START -->.*?<!-- CURRENT_ACTIVITY_END -->"

          if re.search(pattern, readme, re.DOTALL):
              readme = re.sub(
                  pattern,
                  new_section,
                  readme,
                  flags=re.DOTALL
              )
          else:
              readme += "\n\n" + new_section + "\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)

          print(activity)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update current activity"
            git push
          fi

name: Update Current Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get activity
        id: activity
        run: |
          ACTIVITY=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/kunthorkov/events/public \
            | python -c "import sys,json; d=json.load(sys.stdin); e=d[0] if d else {}; t=e.get('type',''); r=e.get('repo',{}).get('name',''); print('💻 Latest GitHub activity: ' + t.replace('Event','') + ' in \`' + r + '\`')" )

          echo "activity=$ACTIVITY" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          ACTIVITY: ${{ steps.activity.outputs.activity }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timezone

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          activity = os.environ["ACTIVITY"]
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          section = f"""<!-- CURRENT_ACTIVITY_START -->
          ### 🔥 Latest GitHub Activity

          > {activity}

          _Last updated: {now}_
          <!-- CURRENT_ACTIVITY_END -->"""

          pattern = r"<!-- CURRENT_ACTIVITY_START -->.*?<!-- CURRENT_ACTIVITY_END -->"

          if re.search(pattern, readme, re.DOTALL):
              readme = re.sub(
                  pattern,
                  section.strip(),
                  readme,
                  flags=re.DOTALL
              )
          else:
              readme += "\n\n" + section.strip() + "\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update current activity"
            git push
          fi

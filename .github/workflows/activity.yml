name: Update Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub activity
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/kunthorkov/events/public \
            -o activity.json

      - name: Update README
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime

          with open("activity.json") as f:
              events = json.load(f)

          activity = "📚 Learning, building, and improving every day."

          if events:
              event = events[0]
              event_type = event.get("type", "Activity")
              repo = event.get("repo", {}).get("name", "")

              activity = f"💻 {event_type.replace('Event', '')} in `{repo}`"

          now = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          new_section = f"""<!-- CURRENT_ACTIVITY_START -->
          ### 🔥 Latest GitHub Activity

          > {activity}

          _Last updated: {now}_
          <!-- CURRENT_ACTIVITY_END -->"""

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- CURRENT_ACTIVITY_START -->.*?<!-- CURRENT_ACTIVITY_END -->"

          readme = re.sub(
              pattern,
              new_section.strip(),
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update current activity"
            git push
          fi
